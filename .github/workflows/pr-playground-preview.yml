name: PR Playground Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build blueprint from repo file (ref = PR branch)
        id: bp
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            let bp = fs.readFileSync('_devenv/playground-blueprint.json', 'utf8');
            bp = bp.replace(/"ref":\s*"[^"]*"/, `"ref": "${context.payload.pull_request.head.ref}"`);
            JSON.parse(bp);
            return bp;

      - uses: WordPress/action-wp-playground-pr-preview@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          blueprint: ${{ steps.bp.outputs.result }}
