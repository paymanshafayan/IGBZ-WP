name: Railway Volume Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'railway/**'
      - 'railway.json'

jobs:
  ensure-volume:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SERVICE_NAME: ${{ github.event.repository.name }}
      MOUNT_PATH: /var/www/html/wp-content
    steps:
      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Ensure persistent volume exists
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set"; exit 1
          fi

          echo "service: ${SERVICE_NAME} · mount: ${MOUNT_PATH}"

          # اعتبار توکن را همین اول قطعی چک کن (بدون || true تا خطا پنهان نشود)
          if ! LIST="$(railway volume -s "${SERVICE_NAME}" list 2>&1)"; then
            echo "$LIST"
            echo "::error::RAILWAY_TOKEN invalid or has no access — use a PROJECT token (Project Settings → Tokens, environment: production)"
            exit 1
          fi
          echo "$LIST"

          if echo "$LIST" | grep -q "${MOUNT_PATH}"; then
            echo "volume already exists — nothing to do ✅"
            exit 0
          fi

          echo "volume not found — creating…"
          # نحو درست نسخهٔ جدید CLI: سرویس قبل از زیرفرمان، مسیر با -m
          railway volume -s "${SERVICE_NAME}" add -m "${MOUNT_PATH}"

          echo "volume created ✅"
