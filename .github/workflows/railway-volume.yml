# Railway Volume Guard — اطمینان از وجود ولوم دائمی قبل/بعد از استقرار
#
# کاری که می‌کند: با CLI رسمی ریل‌وی چک می‌کند سرویسِ هم‌نام مخزن (IGBZ-WP)
# ولومی روی مسیر /var/www/html/wp-content دارد یا نه؛ اگر نداشت، خودش می‌سازد.
# احراز هویت: سیکرت RAILWAY_TOKEN (توکن پروژهٔ ریل‌وی) — ساختهٔ کارفرما.
#
# نسخهٔ مرجع: _devenv/github-workflow-railway-volume.yml
# نصب: .github/workflows/railway-volume.yml (دستی توسط مالک مخزن — توکن ایجنت
# مجوز workflows ندارد؛ HANDOFF §۷.۶-پ)

name: Railway Volume Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'railway/**'
      - 'railway.json'

jobs:
  ensure-volume:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SERVICE_NAME: ${{ github.event.repository.name }}
      MOUNT_PATH: /var/www/html/wp-content
    steps:
      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Ensure persistent volume exists
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set"; exit 1
          fi

          echo "service: ${SERVICE_NAME} · mount: ${MOUNT_PATH}"

          # فهرست ولوم‌های پروژه؛ اگر ولومی با این mount-path روی سرویس بود، کاری نمی‌کنیم
          LIST="$(railway volume list 2>&1 || true)"
          echo "$LIST"

          if echo "$LIST" | grep -q "${MOUNT_PATH}"; then
            echo "volume already exists — nothing to do ✅"
            echo "### ولوم از قبل موجود است ✅" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "volume not found — creating…"
          railway volume add \
            --service "${SERVICE_NAME}" \
            --mount-path "${MOUNT_PATH}"

          echo "### ولوم ساخته شد: ${MOUNT_PATH} روی ${SERVICE_NAME} ✅" >> "$GITHUB_STEP_SUMMARY"
