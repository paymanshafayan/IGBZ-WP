# دکمهٔ «Preview in WordPress Playground» روی هر Pull Request
#
# چه می‌کند: با هر PR (باز شدن یا به‌روزرسانی)، اکشن رسمی وردپرس یک دکمهٔ
# پیش‌نمایش به توضیحات PR اضافه می‌کند. کلیک روی دکمه، وردپرس تازه‌ای را در
# مرورگرِ خودِ بیننده بالا می‌آورد (PHP-WASM؛ بدون هیچ سرور و سندباکسی) با:
#   - ووکامرس نصب و فعال
#   - igbz-suite مستقیم از همین ریپو و «همان شاخهٔ PR» نصب و فعال
#   - هر ۶ ماژول روشن (multitenant, instagram, hub, fx, rest_api, pado)
#   - ورود خودکار admin
#
# نیازی به build نیست — igbz-suite مستقیم از checkout ریپو اجرا می‌شود
# (بدون Composer/npm)، پس حالت بدون build کافی است.
#
# مرجع: https://github.com/WordPress/action-wp-playground-pr-preview (v3)

name: PR Playground Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: WordPress/action-wp-playground-pr-preview@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          blueprint: |
            {
              "$schema": "https://playground.wordpress.net/blueprint-schema.json",
              "preferredVersions": { "php": "8.2", "wp": "latest" },
              "features": { "networking": true },
              "login": true,
              "landingPage": "/wp-admin/plugins.php",
              "steps": [
                {
                  "step": "installPlugin",
                  "pluginData": { "resource": "wordpress.org/plugins", "slug": "woocommerce" },
                  "options": { "activate": true }
                },
                {
                  "step": "installPlugin",
                  "pluginData": {
                    "resource": "git:directory",
                    "url": "https://github.com/${{ github.repository }}",
                    "ref": "${{ github.event.pull_request.head.ref }}",
                    "refType": "branch",
                    "path": "igbz-suite"
                  },
                  "options": { "activate": true }
                },
                {
                  "step": "runPHP",
                  "code": "<?php require_once '/wordpress/wp-load.php'; update_option('igbz_enabled_modules', ['multitenant','instagram','hub','fx','rest_api','pado']); update_option('timezone_string','Asia/Tehran');"
                }
              ]
            }
