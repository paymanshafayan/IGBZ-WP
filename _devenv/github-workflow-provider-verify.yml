# Reference workflow — live verification of Zernio + DeepInfra keys (PV-*)

# Self-contained: no dependency on repository files, so it works from any
# branch. Copy this file into `.github/workflows/provider-verify.yml` on the
# DEFAULT branch (`main`) — the "Run workflow" button only appears for
# workflows present on the default branch.

name: Provider key verification (Zernio + DeepInfra)

on:
  workflow_dispatch:
    inputs:
      zernio:
        description: 'Zernio: run the central-key profile probe (create → verify → delete)'
        type: boolean
        default: true
      deepinfra:
        description: 'DeepInfra: run the key + model probe with a tiny Persian prompt'
        type: boolean
        default: true
      deepinfra_models:
        description: 'Comma-separated models to probe (empty = plugin pinned list)'
        type: string
        required: false
        default: ''
      zernio_cleanup_ids:
        description: 'Optional: comma-separated profile ids to delete first (e.g. leftover probes)'
        type: string
        required: false
        default: ''

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe providers
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          RUN_ZERNIO: ${{ inputs.zernio }}
          RUN_DEEPINFRA: ${{ inputs.deepinfra }}
          DEEPINFRA_MODELS: ${{ inputs.deepinfra_models }}
          ZERNIO_CLEANUP_IDS: ${{ inputs.zernio_cleanup_ids }}
        run: |
          set -uo pipefail
          FAILED=0
          PASS() { echo "PASS  $1"; }
          FAIL() { echo "FAIL  $1"; FAILED=$((FAILED+1)); }

          # ---------------- DeepInfra (OpenAI-compatible chat/completions) ----------------
          if [ "${RUN_DEEPINFRA:-true}" = "true" ]; then
            if [ -z "${DEEPINFRA_API_KEY:-}" ]; then
              FAIL "deepinfra  DEEPINFRA_API_KEY secret missing"
            else
              ENDPOINT="https://api.deepinfra.com/v1/openai/chat/completions"
              PROMPT="در یک جمله کوتاه، مهم‌ترین مزیت یک فروشگاه اینستاگرامی را بنویس."
              MODELS="${DEEPINFRA_MODELS:-deepseek-ai/DeepSeek-V3,moonshotai/Kimi-K2.7-Code,moonshotai/Kimi-K3}"
              OLDIFS=$IFS; IFS=','; read -ra ML <<< "$MODELS"; IFS=$OLDIFS
              for MODEL in "${ML[@]}"; do
                MODEL="$(printf '%s' "$MODEL" | xargs)"
                [ -z "$MODEL" ] && continue
                BODY=$(jq -nc --arg m "$MODEL" --arg p "$PROMPT" \
                  '{model:$m,messages:[{role:"user",content:$p}],max_tokens:128,temperature:0.2}')
                HTTP="000"
                HTTP=$(curl -sS -m 60 -o /tmp/di.json -w '%{http_code}' \
                  -X POST "$ENDPOINT" \
                  -H "Authorization: Bearer $DEEPINFRA_API_KEY" \
                  -H "Content-Type: application/json" \
                  -d "$BODY" 2>/dev/null) || HTTP="000"
                ERRMSG=$(jq -r '.error // .message // ""' /tmp/di.json 2>/dev/null | head -c 160)
                if [ "$HTTP" = "000" ]; then
                  FAIL "deepinfra:$MODEL  network/abort"
                elif [ "$HTTP" = "401" ] || [ "$HTTP" = "403" ]; then
                  FAIL "deepinfra:$MODEL  HTTP $HTTP — key rejected"
                elif [ "$HTTP" = "402" ]; then
                  FAIL "deepinfra:$MODEL  HTTP 402 — account has no credits/payment. ${ERRMSG}"
                elif [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
                  FAIL "deepinfra:$MODEL  HTTP $HTTP — ${ERRMSG}"
                else
                  COST=$(jq -r '.usage.estimated_cost // "n/a"' /tmp/di.json 2>/dev/null)
                  REPLY=$(jq -r '.choices[0].message.content // ""' /tmp/di.json 2>/dev/null | head -c 100)
                  PASS "deepinfra:$MODEL  HTTP $HTTP estimated_cost=$COST reply=$REPLY"
                fi
              done
            fi
          else
            PASS "deepinfra  skipped (RUN_DEEPINFRA=false)"
          fi

          # ---------------- Zernio (central key: create → verify → delete) ----------------
          if [ "${RUN_ZERNIO:-true}" = "true" ]; then
            if [ -z "${ZERNIO_API_KEY:-}" ]; then
              FAIL "zernio  ZERNIO_API_KEY secret missing"
            else
              BASE="https://zernio.com/api/v1"
              # Optional cleanup of leftover probe profiles (e.g. from earlier runs).
              CLEANUP_IDS="${ZERNIO_CLEANUP_IDS:-}"
              if [ -n "$CLEANUP_IDS" ]; then
                OLDIFS=$IFS; IFS=','; read -ra CIDS <<< "$CLEANUP_IDS"; IFS=$OLDIFS
                for CID in "${CIDS[@]}"; do
                  CID="$(printf '%s' "$CID" | xargs)"
                  [ -z "$CID" ] && continue
                  CH="000"
                  CH=$(curl -sS -m 60 -o /tmp/zc.json -w '%{http_code}'                     -X DELETE "$BASE/profiles/$CID"                     -H "Authorization: Bearer $ZERNIO_API_KEY" 2>/dev/null) || CH="000"
                  if [ "$CH" -ge 200 ] && [ "$CH" -lt 300 ]; then
                    PASS "zernio:cleanup:$CID  HTTP $CH"
                  else
                    FAIL "zernio:cleanup:$CID  HTTP $CH"
                  fi
                done
              fi
              SLUG="igbz-ci-probe-$(date +%s)"
              HTTP="000"
              HTTP=$(curl -sS -m 60 -o /tmp/zp.json -w '%{http_code}' \
                -X POST "$BASE/profiles" \
                -H "Authorization: Bearer $ZERNIO_API_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"name\":\"$SLUG\",\"description\":\"IGBZ CI probe (auto-deleted)\"}" 2>/dev/null) || HTTP="000"
              # Mask any field whose name looks like a key/token/secret, then show the shape.
              SHAPE=$(jq -c 'walk(if type=="object" then with_entries(if (.key|ascii_downcase|test("key|token|secret")) then .value="***" else . end) else . end)' /tmp/zp.json 2>/dev/null | head -c 400)
              echo "zernio:create-profile HTTP=$HTTP body=$SHAPE"
              if [ "$HTTP" = "000" ]; then
                FAIL "zernio:create-profile  network/abort"
              elif [ "$HTTP" = "401" ] || [ "$HTTP" = "403" ]; then
                FAIL "zernio:create-profile  HTTP $HTTP — key rejected"
              elif [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
                FAIL "zernio:create-profile  HTTP $HTTP"
              else
                PID=$(jq -r '.profile._id // .data.profile._id // .data.profile_id // .data.profileId // .data._id // .data.id // .profile_id // .profileId // ._id // .id // .profile.id // .result.id // .result._id // .result.profile_id // .result.profile._id // empty' /tmp/zp.json 2>/dev/null)
                if [ -z "$PID" ]; then
                  FAIL "zernio:create-profile  HTTP $HTTP — no profile id in response (see body above)"
                else
                  PASS "zernio:create-profile  HTTP $HTTP profile_id=$PID"
                  DHTTP="000"
                  DHTTP=$(curl -sS -m 60 -o /tmp/zd.json -w '%{http_code}' \
                    -X DELETE "$BASE/profiles/$PID" \
                    -H "Authorization: Bearer $ZERNIO_API_KEY" 2>/dev/null) || DHTTP="000"
                  if [ "$DHTTP" -ge 200 ] && [ "$DHTTP" -lt 300 ]; then
                    PASS "zernio:delete-profile (cleanup)  HTTP $DHTTP"
                  else
                    FAIL "zernio:delete-profile (cleanup)  HTTP $DHTTP"
                  fi
                fi
              fi
            fi
          else
            PASS "zernio  skipped (RUN_ZERNIO=false)"
          fi

          echo ""
          echo "Failures: $FAILED"
          [ "$FAILED" -eq 0 ] || exit 1
