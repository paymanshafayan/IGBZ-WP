-->

					<svg class="ic " viewBox="0 0 320 512" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M192 256c0 17.7-14.3 32-32 32s-32-14.3-32-32 14.3-32 32-32 32 14.3 32 32zm88-32c-17.7 0-32 14.3-32 32s14.3 32 32 32 32-14.3 32-32-14.3-32-32-32zm-240 0c-17.7 0-32 14.3-32 32s14.3 32 32 32 32-14.3 32-32-14.3-32-32-32z" /></svg>
				</button>
				<div id="more-menu" class="pop-menu more-menu" hidden></div>
			</div>
		</header>

		<!-- نمای گفتگو -->
		<div class="view view-chat" id="view-chat">
			<div class="thread" id="chat"></div>

			<!--
				خوش‌آمد، بیرونِ ناحیهٔ اسکرول‌شوندهٔ گفتگو و بالای ردیف دکمهٔ «برو به آخر».
				مرکز‌چینی گروهِ «خوش‌آمد + کادر نوشتن» با مارجین auto انجام می‌شود، نه با
				`justify-content: center` — سرریزِ center نیمی از محتوا را بالای مبدأ می‌برد
				که اسکرول به دست نمی‌رسد. شرح کامل: DESIGN-UI-PARITY.md §۱۷.
			-->
			<div class="welcome-slot" id="welcome-slot">
				<div class="welcome" id="welcome">
					<span class="greet-mark" id="greet-mark"></span>
					<h2 class="greet" id="greet-text" data-t="به ویرا خوش آمدی">به ویرا خوش آمدی</h2>
					<p class="greet-sub" id="greet-sub" data-t="چه کاری برایت انجام بدهم؟">چه کاری برایت انجام بدهم؟</p>
				</div>
			</div>

			<div class="composer-wrap">
				<!-- جای دکمهٔ «برو به آخر»: بالای کادر نوشتن، وسطِ همان ستون. -->
				<div class="jump-slot" id="jump-slot"></div>
				<div id="queue" class="queue" hidden></div>
				<div id="cmd-menu" class="pop-menu" hidden></div>
				<div id="plus-menu" class="pop-menu plus-menu" hidden></div>
				<div id="model-menu" class="pop-menu model-menu" hidden></div>

				<form id="composer" class="composer">
					<div id="attachments" class="attachments" hidden></div>
					<textarea id="input" rows="1" placeholder="امروز چه کمکی از من برمی‌آید؟" data-t-ph="امروز چه کمکی از من برمی‌آید؟"></textarea>

					<div class="composer-bar">
						<button type="button" class="btn icon quiet" id="btn-plus" title="افزودن و ابزارها" data-t-title="افزودن و ابزارها"><svg class="ic " viewBox="0 0 384 512" width="17" height="17" fill="currentColor" aria-hidden="true" focusable="false"><path d="M376 232H216V72c0-4.42-3.58-8-8-8h-32c-4.42 0-8 3.58-8 8v160H8c-4.42 0-8 3.58-8 8v32c0 4.42 3.58 8 8 8h160v160c0 4.42 3.58 8 8 8h32c4.42 0 8-3.58 8-8V280h160c4.42 0 8-3.58 8-8v-32c0-4.42-3.58-8-8-8z" /></svg></button>
						<input type="file" id="file-input" accept="image/*" multiple hidden />

						<span class="grow"></span>

						<button type="button" class="btn quiet" id="pill-model" title="مدل">
							<span id="model-name">—</span>
						</button>
						<button type="button" class="btn quiet sm" id="pill-mode" data-mode="default" title="حالت کار (Shift+Tab)">عادی</button>
						<button type="button" class="btn icon quiet" id="btn-mic" title="گفتن به‌جای نوشتن (Ctrl+M)" data-t-title="گفتن به‌جای نوشتن (Ctrl+M)">
							<svg class="ic " viewBox="0 0 320 512" width="17" height="17" fill="currentColor" aria-hidden="true" focusable="false"><path d="M160 352c53.02 0 96-42.98 96-96V96c0-53.02-42.98-96-96-96S64 42.98 64 96v160c0 53.02 42.98 96 96 96zM96 96c0-35.29 28.71-64 64-64s64 28.71 64 64v160c0 35.29-28.71 64-64 64s-64-28.71-64-64V96zm216 96h-16c-4.42 0-8 3.58-8 8v56c0 73.46-62.2 132.68-136.73 127.71C83.3 379.18 32 319.61 32 251.49V200c0-4.42-3.58-8-8-8H8c-4.42 0-8 3.58-8 8v50.34c0 83.39 61.65 156.12 144 164.43V480H72c-4.42 0-8 3.58-8 8v16c0 4.42 3.58 8 8 8h176c4.42 0 8-3.58 8-8v-16c0-4.42-3.58-8-8-8h-72v-65.01C256.71 406.9 320 338.8 320 256v-56c0-4.42-3.58-8-8-8z" /></svg>
						</button>
						<button type="button" class="btn icon quiet" id="btn-voice" title="بلندخوانی پاسخ" data-t-title="بلندخوانی پاسخ">
							<svg class="ic " viewBox="0 0 640 512" width="17" height="17" fill="currentColor" aria-hidden="true" focusable="false"><path d="M232 96h-16a8 8 0 0 0-8 8v304a8 8 0 0 0 8 8h16a8 8 0 0 0 8-8V104a8 8 0 0 0-8-8zm-96 96h-16a8 8 0 0 0-8 8v112a8 8 0 0 0 8 8h16a8 8 0 0 0 8-8V200a8 8 0 0 0-8-8zm-96 32H24a8 8 0 0 0-8 8v48a8 8 0 0 0 8 8h16a8 8 0 0 0 8-8v-48a8 8 0 0 0-8-8zm384-96h-16a8 8 0 0 0-8 8v240a8 8 0 0 0 8 8h16a8 8 0 0 0 8-8V136a8 8 0 0 0-8-8zm192 96h-16a8 8 0 0 0-8 8v48a8 8 0 0 0 8 8h16a8 8 0 0 0 8-8v-48a8 8 0 0 0-8-8zM520 64h-16a8 8 0 0 0-8 8v368a8 8 0 0 0 8 8h16a8 8 0 0 0 8-8V72a8 8 0 0 0-8-8zM328 0h-16a8 8 0 0 0-8 8v496a8 8 0 0 0 8 8h16a8 8 0 0 0 8-8V8a8 8 0 0 0-8-8z" /></svg>
						</button>
						<button id="stop" type="button" class="btn icon solid" hidden title="توقف (Esc)" data-t-title="توقف (Esc)"><svg class="ic " viewBox="0 0 448 512" width="11" height="11" fill="currentColor" aria-hidden="true" focusable="false"><path d="M400 32H48C21.5 32 0 53.5 0 80v352c0 26.5 21.5 48 48 48h352c26.5 0 48-21.5 48-48V80c0-26.5-21.5-48-48-48z" /></svg></button>
						<button id="send" type="submit" class="btn icon brand" hidden title="ارسال" data-t-title="ارسال">
							<svg class="ic " viewBox="0 0 448 512" width="15" height="15" fill="currentColor" aria-hidden="true" focusable="false"><path d="M34.9 289.5l-22.2-22.2c-9.4-9.4-9.4-24.6 0-33.9L207 39c9.4-9.4 24.6-9.4 33.9 0l194.3 194.3c9.4 9.4 9.4 24.6 0 33.9L413 289.4c-9.5 9.5-25 9.3-34.3-.4L264 168.6V456c0 13.3-10.7 24-24 24h-32c-13.3 0-24-10.7-24-24V168.6L69.2 289.1c-9.3 9.8-24.8 10-34.3.4z" /></svg>
						</button>
					</div>

				</form>

				<!--
					نوار گیت — این یکی در Claude نیست و عمداً اضافه شده: خواستهٔ صریح
					کارفرما از روی رابط Arena بود. بقیهٔ اجزا کپی برابر اصل‌اند.
				-->
				<div class="git-bar" id="git-bar" hidden>
					<button type="button" class="btn quiet sm git-chip" id="git-repo" title="مخزن — کلیک برای تعویض یا اتصال">
						<svg class="ic " viewBox="0 0 448 512" width="13" height="13" fill="currentColor" aria-hidden="true" focusable="false"><path d="M356 160H188c-6.6 0-12-5.4-12-12v-8c0-6.6 5.4-12 12-12h168c6.6 0 12 5.4 12 12v8c0 6.6-5.4 12-12 12zm12 52v-8c0-6.6-5.4-12-12-12H188c-6.6 0-12 5.4-12 12v8c0 6.6 5.4 12 12 12h168c6.6 0 12-5.4 12-12zm64.7 268h3.3c6.6 0 12 5.4 12 12v8c0 6.6-5.4 12-12 12H80c-44.2 0-80-35.8-80-80V80C0 35.8 35.8 0 80 0h344c13.3 0 24 10.7 24 24v368c0 10-6.2 18.6-14.9 22.2-3.6 16.1-4.4 45.6-.4 65.8zM128 384h288V32H128v352zm-96 16c13.4-10 30-16 48-16h16V32H80c-26.5 0-48 21.5-48 48v320zm372.3 80c-3.1-20.4-2.9-45.2 0-64H80c-64 0-64 64 0 64h324.3z" /></svg>
						<span id="git-repo-name">—</span>
					</button>

					<button type="button" class="btn quiet sm git-chip" id="git-branch" title="شاخه — کلیک برای تعویض یا ساخت">
						<svg class="ic " viewBox="0 0 384 512" width="13" height="13" fill="currentColor" aria-hidden="true" focusable="false"><path d="M384 144c0-44.2-35.8-80-80-80s-80 35.8-80 80c0 39.2 28.2 71.8 65.5 78.7-.8 17.2-5 30.4-12.7 40-17.5 21.8-53.1 25.2-90.7 28.7-28.2 2.6-57.4 5.4-80.4 16.9-3.4 1.7-6.7 3.6-9.7 5.7V158.4c36.5-7.4 64-39.7 64-78.4 0-44.2-35.8-80-80-80S0 35.8 0 80c0 38.7 27.5 71 64 78.4v195.2C27.5 361 0 393.3 0 432c0 44.2 35.8 80 80 80s80-35.8 80-80c0-36.9-24.9-67.9-58.9-77.2 5-9.6 12.3-14.6 19-18 17.5-8.8 42.5-11.2 68.9-13.7 42.6-4 86.7-8.1 112.7-40.5 12.4-15.5 19-35.5 19.8-60.7C357.3 214 384 182.1 384 144zM32 80c0-26.5 21.5-48 48-48s48 21.5 48 48-21.5 48-48 48-48-21.5-48-48zm96 352c0 26.5-21.5 48-48 48s-48-21.5-48-48c0-26.4 21.4-47.9 47.8-48h.6c26.3.2 47.6 21.7 47.6 48zm187.8-241.5L304 192c-26.5 0-48-21.5-48-48s21.5-48 48-48 48 21.5 48 48c0 22.4-15.4 41.2-36.2 46.5z" /></svg>
						<span id="git-branch-name">—</span>
					</button>

					<button type="button" class="btn quiet sm mono" id="git-stat" title="تغییرات — کلیک برای دیدن دیف">
						<span class="plus" id="git-plus">+۰</span>
						<span class="minus" id="git-minus">−۰</span>
					</button>

					<button type="button" class="btn solid sm push-end" id="git-action">ثبت تغییرات</button>
				</div>

				<div id="git-menu" class="pop-menu git-menu" hidden></div>

				<p class="disclaimer" data-t="ویرا هم اشتباه می‌کند. کارهای مهم را خودت بازبینی کن.">ویرا هم اشتباه می‌کند. کارهای مهم را خودت بازبینی کن.</p>
			</div>
		</div>

		<!-- نمای صفحه‌ها (گفتگوها، پروژه‌ها، ابزارها، تغییرات، فضای کار) -->
		<div class="view page" id="view-panel" hidden>
			<div class="page-inner" id="panel-body"></div>
		</div>
	 </div>
	</main>
</div>

<!-- ═══════════════════════════════════════════════ تنظیمات: مودال بزرگ -->
<dialog class="set-modal" id="settings">
	<div class="set-shell">
		<nav class="set-nav" id="set-nav"></nav>
		<div class="set-main">
			<div class="set-head">
				<h2 id="set-title" data-t="تنظیمات">تنظیمات</h2>
				<div class="set-head-actions" id="set-head-actions"></div>
				<button class="btn icon round quiet" id="set-close" title="بستن" data-t-title="بستن">
					<svg class="ic " viewBox="0 0 320 512" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z" /></svg>
				</button>
			</div>
			<div class="set-body" id="set-body"></div>
		</div>
	</div>
</dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
